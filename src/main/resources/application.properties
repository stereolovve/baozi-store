spring.application.name=baozi-store
server.port=8080

# ---------- MySQL (padrão) ----------
# Crie o banco antes:  CREATE DATABASE baozi_store;
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mensagem de erro legível nas respostas 4xx
server.error.include-message=always
